<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1a55"/>
      <stop offset="60%" stop-color="#1a1340"/>
      <stop offset="100%" stop-color="#0b0820"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="50%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#c9a73d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f5d76e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5d76e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- soft glow behind the star -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- 8-pointed compass star -->
  <g transform="translate(256 256)">
    <!-- outer points -->
    <path d="
      M 0,-180
      L 38,-38
      L 180,0
      L 38,38
      L 0,180
      L -38,38
      L -180,0
      L -38,-38
      Z
    " fill="url(#star)"/>
    <!-- diagonal smaller star (rotated 45deg, gives 8-pointed look) -->
    <path d="
      M 0,-110
      L 22,-22
      L 110,0
      L 22,22
      L 0,110
      L -22,22
      L -110,0
      L -22,-22
      Z
    " fill="url(#star)" opacity="0.55" transform="rotate(45)"/>
    <!-- center jewel -->
    <circle r="14" fill="#0b0820"/>
    <circle r="6" fill="#f5d76e"/>
  </g>

  <!-- four small accent stars in corners -->
  <g fill="#f5d76e" opacity="0.7">
    <circle cx="96" cy="96" r="3"/>
    <circle cx="416" cy="96" r="3"/>
    <circle cx="96" cy="416" r="3"/>
    <circle cx="416" cy="416" r="3"/>
  </g>
</svg>
