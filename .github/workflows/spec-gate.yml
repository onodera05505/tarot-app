name: spec-gate

# 仕様（docs/）と、仕様⇔コード⇔テストの対応を機械で見る（原本 harness の spec-lint と trace-check）。
# フックは回避できるので、回避できない層としてここで回す。新規違反が 1 件でもあれば落ちる
# （既存の違反は .trace-baseline.json / .spec-baseline.json に記録してあり、減る方向だけを許す）。
# harness の版は apm.yml の 1 箇所で決める（ここと deploy.yml は apm.yml から読む）。
# 通し（シナリオ）テストは別ジョブで回す（frontend/e2e。ブラウザを起動するので単体とは分ける。保留の印が付いたテストは数えるだけで落とさない）。

on:
  pull_request:
  push:

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch harness tools (apm.yml の版)
        run: |
          TAG=$(grep -o 'develop-core#v[0-9.]*' apm.yml | cut -d'#' -f2)
          git clone --branch "$TAG" --depth 1 https://github.com/tsay-dev/harness.git .harness
      - name: Validate docs SSOT
        run: node .harness/tools/spec-lint/spec-lint.mjs validate
      - name: Trace check (new violations fail)
        run: node .harness/tools/trace-check/trace-check.mjs

  scenario:
    # 通しは配る前の 4 段（REQ-081）には入れない別の層。落ちても配信は止めない（deploy.yml とは独立）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build (preview の元。無料版 dist/ と、機能フラグ有効の版 dist-deep/ の 2 つ)
        working-directory: frontend
        run: pnpm build && pnpm build:deep
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Scenario tests (UC ごとに 1 本)
        working-directory: frontend
        run: pnpm exec playwright test
