name: Deploy

on:
  push:
    branches: [main]
  # 手動トリガーも有効化（Actions タブから "Run workflow" できる）
  workflow_dispatch:

# バックエンド (Cloudflare Workers) のデプロイは廃止。
# 22 枚のカードデータをフロントエンド内に同梱するローカル完結構成に移行。
# backend/ ディレクトリは過去のリファレンスとしてリポジトリに残しているが、
# CI ではインストールもビルドもデプロイもしない（2026-09-02 に完全分離）。

jobs:
  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # jsdom 30（テスト環境）が Node 20 に無い API を使うため、
          # ローカル開発と同じ Node 24 に揃えている。下げると CI のテストが
          # 「webidl.util.markAsUncloneable is not a function」で落ちる
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        # wrangler は frontend の devDependencies に入れてある（backend/ は
        # 参照用残骸で、CI からは一切触らない）
        run: pnpm exec wrangler pages deploy dist --project-name tarot-oracle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
