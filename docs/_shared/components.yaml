# docs/_shared/components.yaml — the contracts' shared vocabulary ($ref targets)
# What may go here: only what 2+ UCs use (auth schemes, error codes, shared DTOs)
# A schema used by only one UC is written in that contract (inline, or under the contract's own top-level
# schemas: when 2+ operations of that UC share it) — never here
# Only the orchestrator writes here. Concurrent producers never append; they report the vocabulary they want added
# Accepted YAML is the same strict subset as contract.yaml (no anchors/aliases, no block scalars)

# Auth schemes referenced by a contract's `auth:`. An operation naming an undefined scheme is an error
# NOTHING is enabled by default — the harness never decides a host's auth method (CLAUDE.md §0).
# Enable the ones this project actually uses; several may coexist
authSchemes: {}
  # session:                 # web: a cookie session
  #   kind: cookie
  #   name: session
  # bearer:                  # native / SPA: a token in the Authorization header
  #   kind: token
  #   scheme: Bearer
  #   storage: keychain      # where the token lives (keychain / secure-store / memory). Native must state this
  # apiKey:
  #   kind: header
  #   name: X-Api-Key

# The closed vocabulary for a contract's `errors[].code`. An undefined code is an error.
# The value is a one-line note on what the code means (the triggering condition goes in the contract's `when:`).
# trace-check C7 checks that the implementation's error codes are a subset of these keys (when traceconfig.json configures `contract`)
errorCodes:
  STORAGE_WRITE_FAILED: 端末への記録の書き込みに失敗した
  UPSTREAM_UNREACHABLE: 外部の配信元・サービスに届かなかった
  # 2026-10-03: コードに実在する失敗の経路 2 つ分だけ（本日の一枚の記録の書き込み、新しい版の問い合わせ）。
  # 実装はエラーコードを持たない（例外をそのまま扱う）ので、traceconfig.json に contract は置かず、C7 は skip のまま

# Shared DTOs used by 2+ UCs
# $ref target (from docs/goals/<GOAL>/<UC>/contract.yaml): ../../../_shared/components.yaml#/schemas/<Name>
schemas:
  # UC-001（占い履歴）と UC-003（本日の一枚）が共有する形。値の正本は frontend/src/lib/types.ts の型
  TarotCard:
    type: object
    required: [id, nameEn, nameJa, number, arcanaType, meaningUpright, meaningReversed, descriptionUpright, descriptionReversed, imageUrl]
    properties:
      id: { type: integer }
      nameEn: { type: string }
      nameJa: { type: string }
      number: { type: integer }
      arcanaType: { type: string }
      meaningUpright: { type: string }
      meaningReversed: { type: string }
      descriptionUpright: { type: string }
      descriptionReversed: { type: string }
      imageUrl: { type: string }
  DrawnCard:
    type: object
    required: [card, orientation, keywords]
    properties:
      card: { $ref: "#/schemas/TarotCard" }
      orientation: { type: string, enum: [upright, reversed] }
      keywords: { type: array, items: { type: string } }
