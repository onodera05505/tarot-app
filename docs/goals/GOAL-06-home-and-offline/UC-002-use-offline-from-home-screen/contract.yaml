x-no-boundary: "自前の境界は無い。この UC が越える境界は 2 つで、どちらも ADR-0008 に従って UC-008 の契約が操作として持つ: アプリの全体を端末に保持する仕組みの登録（操作 registerSW。新しい版が届くことの入口でもある）と、ネイティブのアプリとして動いているかの判定（操作 isNativePlatform）。ホーム画面に置くための宣言（vite.config.ts の manifest）はそれ自体が機械可読な正本なので写さない"
